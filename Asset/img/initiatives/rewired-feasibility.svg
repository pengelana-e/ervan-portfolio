<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" style="background:#0b0c0e">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3a86ff"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="url(#bgGrad2)"/>

  <g transform="translate(60, 45)">
    <text x="0" y="30" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="2">EDUCATIONAL FRAMEWORK · 5-STEP FEASIBILITY</text>
    <text x="0" y="65" font-family="'Anton', sans-serif" font-size="34" fill="#f2efeb" letter-spacing="1">REWIRED FEASIBILITY TOOLKIT</text>
    <text x="0" y="88" font-family="'Manrope', sans-serif" font-size="13" fill="#8f8987">Stress-testing land, capital requirements, cost curves, and cashflow risks before execution.</text>

    <!-- 5 Step Flow Horizontal -->
    <g transform="translate(0, 130)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect width="155" height="180" rx="6" fill="#141113" stroke="#362024"/>
        <text x="18" y="32" font-family="'Anton', sans-serif" font-size="26" fill="#38BDF8">01</text>
        <text x="18" y="60" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#f2efeb">MARKET</text>
        <text x="18" y="76" font-family="'Manrope', sans-serif" font-size="11" fill="#7DD3FC">DEMAND</text>
        <line x1="18" y1="90" x2="135" y2="90" stroke="#2c1a1d"/>
        <text x="18" y="112" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Absorpsi unit</text>
        <text x="18" y="128" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Price ceiling</text>
        <text x="18" y="144" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Profil pembeli</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(170, 0)">
        <rect width="155" height="180" rx="6" fill="#141113" stroke="#362024"/>
        <text x="18" y="32" font-family="'Anton', sans-serif" font-size="26" fill="#38BDF8">02</text>
        <text x="18" y="60" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#f2efeb">COST</text>
        <text x="18" y="76" font-family="'Manrope', sans-serif" font-size="11" fill="#7DD3FC">STRUCTURE</text>
        <line x1="18" y1="90" x2="135" y2="90" stroke="#2c1a1d"/>
        <text x="18" y="112" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Harga dasar tanah</text>
        <text x="18" y="128" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Infrastruktur fisik</text>
        <text x="18" y="144" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">HPP konstruksi</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(340, 0)">
        <rect width="155" height="180" rx="6" fill="#141113" stroke="#362024"/>
        <text x="18" y="32" font-family="'Anton', sans-serif" font-size="26" fill="#38BDF8">03</text>
        <text x="18" y="60" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#f2efeb">CASHFLOW</text>
        <text x="18" y="76" font-family="'Manrope', sans-serif" font-size="11" fill="#7DD3FC">SIMULATION</text>
        <line x1="18" y1="90" x2="135" y2="90" stroke="#2c1a1d"/>
        <text x="18" y="112" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Peak capital deficit</text>
        <text x="18" y="128" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Timing pembayaran</text>
        <text x="18" y="144" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Jadwal termin</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(510, 0)">
        <rect width="155" height="180" rx="6" fill="#141113" stroke="#362024"/>
        <text x="18" y="32" font-family="'Anton', sans-serif" font-size="26" fill="#38BDF8">04</text>
        <text x="18" y="60" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#f2efeb">STRESS</text>
        <text x="18" y="76" font-family="'Manrope', sans-serif" font-size="11" fill="#7DD3FC">TESTING</text>
        <line x1="18" y1="90" x2="135" y2="90" stroke="#2c1a1d"/>
        <text x="18" y="112" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Skenario pesimis</text>
        <text x="18" y="128" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Kenaikan material</text>
        <text x="18" y="144" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Penurunan tempo</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(680, 0)">
        <rect width="155" height="180" rx="6" fill="#1c1214" stroke="#38BDF8"/>
        <text x="18" y="32" font-family="'Anton', sans-serif" font-size="26" fill="#38BDF8">05</text>
        <text x="18" y="60" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#f2efeb">GO / NO-GO</text>
        <text x="18" y="76" font-family="'Manrope', sans-serif" font-size="11" fill="#38BDF8">DECISION</text>
        <line x1="18" y1="90" x2="135" y2="90" stroke="#48252a"/>
        <text x="18" y="112" font-family="'Manrope', sans-serif" font-size="10" fill="#f2efeb">Validasi margin</text>
        <text x="18" y="128" font-family="'Manrope', sans-serif" font-size="10" fill="#f2efeb">Batas toleransi</text>
        <text x="18" y="144" font-family="'Manrope', sans-serif" font-size="10" fill="#f2efeb">Komitmen modal</text>
      </g>
    </g>

    <!-- Bottom Narrative -->
    <g transform="translate(0, 350)">
      <rect width="835" height="110" rx="6" fill="#0c1a29" stroke="#27191b"/>
      <text x="24" y="35" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#f2efeb">LOGIKA KEPUTUSAN DI ATAS ASUMSI</text>
      <text x="24" y="62" font-family="'Manrope', sans-serif" font-size="11" fill="#a09c9a">"Kesalahan terbesar dalam pengembangan properti sering terjadi bukan saat pembangunan fisik berjalan,</text>
      <text x="24" y="80" font-family="'Manrope', sans-serif" font-size="11" fill="#a09c9a">tetapi ketika keputusan pembelian lahan dan struktur biaya di awal tidak pernah diuji terhadap risiko terburuk."</text>
      <text x="24" y="100" font-family="'Manrope', sans-serif" font-size="10" fill="#38BDF8">REWIRED REAL ESTATE DECISION FRAMEWORK</text>
    </g>
  </g>
</svg>