    <text x="115" y="62" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#e32b3c" text-anchor="middle">INITIATIVE</text>

    <!-- Corner Decorative Accents -->
    <path d="M 24,44 L 24,24 L 44,24" fill="none" stroke="#e32b3c" stroke-width="2"/>
    <path d="M 936,44 L 936,24 L 916,24" fill="none" stroke="#e32b3c" stroke-width="2"/>
    <path d="M 24,556 L 24,576 L 44,576" fill="none" stroke="#e32b3c" stroke-width="2"/>
    <path d="M 936,556 L 936,576 L 916,576" fill="none" stroke="#e32b3c" stroke-width="2"/>

    <!-- Dynamic Artwork Content -->
    
      <!-- Technical Grid &amp; Architectural Lines -->
      <line x1="100" y1="100" x2="860" y2="100" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
