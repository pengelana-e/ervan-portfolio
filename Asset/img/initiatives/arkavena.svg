      <circle cx="760" cy="480" r="5" fill="#f2efeb"/>

      <!-- Technical Crosshairs &amp; Coordinates -->
      <text x="140" y="470" font-family="'Manrope', sans-serif" font-size="11" letter-spacing="2" fill="#888">COST / SCHEDULE / SCOPE / QUALITY</text>
      <text x="140" y="490" font-family="'Manrope', sans-serif" font-size="9" letter-spacing="3" fill="#e32b3c">CONTROL PROTOCOL · REV 1.0</text>
    

    <!-- Watermark Brand Title -->
    <text x="50" y="545" font-family="'Anton', Impact, sans-serif" font-size="28" letter-spacing="2" fill="#ffffff" opacity="0.9">ARKAVENA</text>
    <text x="50" y="565" font-family="'Manrope', sans-serif" font-size="9" font-weight="600" letter-spacing="3" fill="#888">PROJECT CONTROL &amp; BUILT ENVIRONMENT</text>
