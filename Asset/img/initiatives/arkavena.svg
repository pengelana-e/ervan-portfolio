      <line x1="100" y1="300" x2="860" y2="300" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="100" y1="400" x2="860" y2="400" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="100" y1="500" x2="860" y2="500" stroke="#333" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- Structural Framework Elevation -->
      <polygon points="480,140 760,480 200,480" fill="none" stroke="#e32b3c" stroke-width="2.5"/>
      <line x1="480" y1="140" x2="480" y2="480" stroke="#e32b3c" stroke-width="2"/>
      <line x1="340" y1="310" x2="620" y2="310" stroke="#e32b3c" stroke-width="2"/>
