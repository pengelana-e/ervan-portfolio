<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
    <defs>
      <radialGradient id="cardGrad" cx="50%" cy="40%" r="65%">
        <stop offset="0%" stop-color="#0c1a29"/>
        <stop offset="60%" stop-color="#07111D"/>
        <stop offset="100%" stop-color="#07111D"/>
      </radialGradient>
      <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="100%" stop-color="#0369a1"/>
      </linearGradient>
    </defs>

    <!-- Dark Background -->
    <rect width="960" height="600" fill="url(#cardGrad)"/>

    <!-- Subtle Outer Border -->
    <rect x="24" y="24" width="912" height="552" fill="none" stroke="#1e354d" stroke-width="1"/>

    <!-- Header Badge -->
    <rect x="50" y="46" width="130" height="24" rx="3" fill="#0c1a29" stroke="#38BDF8" stroke-width="1"/>
    <text x="115" y="62" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#38BDF8" text-anchor="middle">AREA OF PRACTICE</text>

    <!-- Corner Decorative Accents -->
    <path d="M 24,44 L 24,24 L 44,24" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 936,44 L 936,24 L 916,24" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 24,556 L 24,576 L 44,576" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M 936,556 L 936,576 L 916,576" fill="none" stroke="#38BDF8" stroke-width="2"/>

    <!-- Dynamic Artwork Content -->
    
      <!-- Modular Process Matrix -->
      <g transform="translate(180, 160)">
        <rect x="0" y="0" width="180" height="90" rx="6" fill="#141213" stroke="#38BDF8" stroke-width="2"/>
        <text x="90" y="40" font-family="'Anton', sans-serif" font-size="14" letter-spacing="2" fill="#fff" text-anchor="middle">INPUT &amp; CONTEXT</text>
        <text x="90" y="60" font-family="'Manrope', sans-serif" font-size="9" fill="#888" text-anchor="middle">Problem Definition</text>

        <line x1="180" y1="45" x2="230" y2="45" stroke="#38BDF8" stroke-width="2"/>

        <rect x="230" y="0" width="180" height="90" rx="6" fill="#181516" stroke="#fff" stroke-width="2"/>
        <text x="320" y="40" font-family="'Anton', sans-serif" font-size="14" letter-spacing="2" fill="#fff" text-anchor="middle">DECISION RULES</text>
        <text x="320" y="60" font-family="'Manrope', sans-serif" font-size="9" fill="#888" text-anchor="middle">System Design</text>

        <line x1="410" y1="45" x2="460" y2="45" stroke="#38BDF8" stroke-width="2"/>

        <rect x="460" y="0" width="180" height="90" rx="6" fill="#141213" stroke="#38BDF8" stroke-width="2"/>
        <text x="550" y="40" font-family="'Anton', sans-serif" font-size="14" letter-spacing="2" fill="#fff" text-anchor="middle">DISCIPLINED OUTPUT</text>
        <text x="550" y="60" font-family="'Manrope', sans-serif" font-size="9" fill="#888" text-anchor="middle">Measured Outcome</text>

        <!-- Feedback Loop -->
        <path d="M 550,90 L 550,140 L 90,140 L 90,90" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="320" y="160" font-family="'Manrope', sans-serif" font-size="9" letter-spacing="2" fill="#38BDF8" text-anchor="middle">CONTINUOUS CORRECTION &amp; FEEDBACK</text>
      </g>

      <text x="140" y="470" font-family="'Manrope', sans-serif" font-size="11" letter-spacing="2" fill="#888">ORGANIZATIONAL CLARITY · ACCOUNTABILITY · OPERATING MODEL</text>
      <text x="140" y="490" font-family="'Manrope', sans-serif" font-size="9" letter-spacing="3" fill="#38BDF8">STRUKTUR EKSEKUSI · SKALABILITAS</text>
    

    <!-- Watermark Brand Title -->
    <text x="50" y="545" font-family="'Anton', Impact, sans-serif" font-size="28" letter-spacing="2" fill="#ffffff" opacity="0.9">BUSINESS ARCHITECTURE</text>
    <text x="50" y="565" font-family="'Manrope', sans-serif" font-size="9" font-weight="600" letter-spacing="3" fill="#888">OPERATIONAL LOGIC &amp; WORKFLOW CLARITY</text>
  </svg>