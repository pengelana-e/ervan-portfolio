<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <radialGradient id="cardGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#191617"/>
      <stop offset="60%" stop-color="#0f0d0e"/>
      <stop offset="100%" stop-color="#080708"/>
    </radialGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e32b3c"/>
      <stop offset="100%" stop-color="#800615"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e32b3c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="960" height="600" fill="url(#cardGrad)"/>

  <!-- Subtle Outer Border -->
  <rect x="24" y="24" width="912" height="552" fill="none" stroke="#252122" stroke-width="1"/>

  <!-- Header Badge -->
  <rect x="50" y="46" width="160" height="24" rx="3" fill="#191617" stroke="#e32b3c" stroke-width="1"/>
  <text x="130" y="62" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#e32b3c" text-anchor="middle">THE TECHNOLOGY</text>

  <!-- Corner Decorative Accents -->
  <path d="M 24,44 L 24,24 L 44,24" fill="none" stroke="#e32b3c" stroke-width="2"/>
  <path d="M 936,44 L 936,24 L 916,24" fill="none" stroke="#e32b3c" stroke-width="2"/>
  <path d="M 24,556 L 24,576 L 44,576" fill="none" stroke="#e32b3c" stroke-width="2"/>
  <path d="M 936,556 L 936,576 L 916,576" fill="none" stroke="#e32b3c" stroke-width="2"/>

  <!-- Technical Grid -->
  <line x1="80" y1="120" x2="880" y2="120" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="240" x2="880" y2="240" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="360" x2="880" y2="360" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="480" x2="880" y2="480" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Systems Architecture Header -->
  <text x="50" y="112" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#e32b3c">APPLIED AI &amp; BUSINESS AUTOMATION</text>
  <text x="50" y="146" font-family="'Anton', Impact, sans-serif" font-size="34" letter-spacing="2" fill="#ffffff">INTELLIGENT SYSTEMS ENGINE</text>
  <text x="50" y="172" font-family="'Manrope', sans-serif" font-size="12" fill="#888">Applied AI Capability · Workflow Automation · Decision Synthesis</text>

  <!-- Central Hub Connections -->
  <circle cx="480" cy="330" r="140" fill="url(#nodeGlow)"/>
  <circle cx="480" cy="330" r="90" fill="none" stroke="#2d2224" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="240" y1="330" x2="720" y2="330" stroke="#3d2226" stroke-width="1"/>
  <line x1="480" y1="220" x2="480" y2="440" stroke="#3d2226" stroke-width="1"/>

  <!-- Module 1: PRAKARA OS (Left) -->
  <g transform="translate(140, 250)">
    <rect width="210" height="150" rx="4" fill="#120f10" stroke="#3a2528" stroke-width="1"/>
    <circle cx="20" cy="24" r="5" fill="#e32b3c"/>
    <text x="35" y="28" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#e32b3c">PRIVATE AI R&amp;D</text>
    <text x="20" y="58" font-family="'Anton', Impact, sans-serif" font-size="20" letter-spacing="1" fill="#ffffff">PRAKARA OS</text>
    <text x="20" y="80" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Legal Due Diligence</text>
    <text x="20" y="96" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Zoning &amp; Land Compliance</text>
    <rect x="20" y="114" width="170" height="20" rx="2" fill="#1a1416" stroke="#2e1b1e" stroke-width="1"/>
    <text x="105" y="128" font-family="'Manrope', sans-serif" font-size="8" font-weight="600" letter-spacing="1" fill="#ff4d5e" text-anchor="middle">ACTIVE TEST GATES</text>
  </g>

  <!-- Module 2: E.C.H.O (Center Top) -->
  <g transform="translate(375, 230)">
    <rect width="210" height="150" rx="4" fill="#120f10" stroke="#e32b3c" stroke-width="1.2"/>
    <circle cx="20" cy="24" r="5" fill="#e32b3c"/>
    <text x="35" y="28" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#e32b3c">WORKFLOW ENGINE</text>
    <text x="20" y="58" font-family="'Anton', Impact, sans-serif" font-size="20" letter-spacing="1" fill="#ffffff">E.C.H.O</text>
    <text x="20" y="80" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Personal AI Assistant</text>
    <text x="20" y="96" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Strategic Workflow Auto</text>
    <rect x="20" y="114" width="170" height="20" rx="2" fill="#1a1416" stroke="#2e1b1e" stroke-width="1"/>
    <text x="105" y="128" font-family="'Manrope', sans-serif" font-size="8" font-weight="600" letter-spacing="1" fill="#e32b3c" text-anchor="middle">EXECUTIVE OPERATIONS</text>
  </g>

  <!-- Module 3: REWIRED Intelligence (Right) -->
  <g transform="translate(610, 250)">
    <rect width="210" height="150" rx="4" fill="#120f10" stroke="#3a2528" stroke-width="1"/>
    <circle cx="20" cy="24" r="5" fill="#e32b3c"/>
    <text x="35" y="28" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#e32b3c">EDTECH ARCHITECTURE</text>
    <text x="20" y="58" font-family="'Anton', Impact, sans-serif" font-size="20" letter-spacing="1" fill="#ffffff">REWIRED INTELLIGENCE</text>
    <text x="20" y="80" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">AI Learning Systems</text>
    <text x="20" y="96" font-family="'Manrope', sans-serif" font-size="10" fill="#a09c9a">Feasibility Knowledge Models</text>
    <rect x="20" y="114" width="170" height="20" rx="2" fill="#1a1416" stroke="#2e1b1e" stroke-width="1"/>
    <text x="105" y="128" font-family="'Manrope', sans-serif" font-size="8" font-weight="600" letter-spacing="1" fill="#ff4d5e" text-anchor="middle">DECISION SUPPORT</text>
  </g>

  <!-- Bottom Watermark & Status -->
  <text x="50" y="545" font-family="'Anton', Impact, sans-serif" font-size="26" letter-spacing="2" fill="#ffffff" opacity="0.9">APPLIED AI &amp; BUSINESS SYSTEMS</text>
  <text x="50" y="565" font-family="'Manrope', sans-serif" font-size="9" font-weight="600" letter-spacing="3" fill="#888">PROVEN TOOLS · INTELLIGENT WORKFLOWS · BUSINESS AUTOMATION</text>
</svg>
