    <line x1="80" y1="360" x2="880" y2="360" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="80" y1="480" x2="880" y2="480" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Main Artwork -->
    
  <!-- AI Neural Graph & Legal Document Matrix -->
  <g transform="translate(480, 240)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#251b1e" stroke-width="1"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#87212b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="40" fill="#181012" stroke="#e32b3c" stroke-width="2"/>
    <text x="0" y="6" font-family="'Anton', sans-serif" font-size="16" fill="#f2efeb" text-anchor="middle">PRAKARA</text>
    <!-- Nodes -->
    <circle cx="-80" cy="-60" r="8" fill="#191617" stroke="#e32b3c" stroke-width="2"/>
    <line x1="-72" y1="-54" x2="-28" y2="-22" stroke="#e32b3c" stroke-width="1.5"/>
    <text x="-95" y="-62" font-family="'Manrope', sans-serif" font-size="9" fill="#888" text-anchor="end">REGULATION</text>
    <circle cx="80" cy="-60" r="8" fill="#191617" stroke="#e32b3c" stroke-width="2"/>
    <line x1="72" y1="-54" x2="28" y2="-22" stroke="#e32b3c" stroke-width="1.5"/>
    <text x="95" y="-62" font-family="'Manrope', sans-serif" font-size="9" fill="#888">TITLE DEED</text>
    <circle cx="0" cy="90" r="8" fill="#191617" stroke="#e32b3c" stroke-width="2"/>
    <line x1="0" y1="82" x2="0" y2="40" stroke="#e32b3c" stroke-width="1.5"/>
