<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
    <defs>
      <radialGradient id="cardGrad" cx="50%" cy="40%" r="65%">
        <stop offset="0%" stop-color="#191617"/>
        <stop offset="60%" stop-color="#0f0d0e"/>
        <stop offset="100%" stop-color="#080708"/>
      </radialGradient>
      <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#e32b3c"/>
        <stop offset="100%" stop-color="#800615"/>
      </linearGradient>
    </defs>

    <!-- Dark Background -->
    <rect width="960" height="600" fill="url(#cardGrad)"/>

    <!-- Subtle Outer Border -->
    <rect x="24" y="24" width="912" height="552" fill="none" stroke="#252122" stroke-width="1"/>

    <!-- Header Badge -->
    <rect x="50" y="46" width="160" height="24" rx="3" fill="#191617" stroke="#e32b3c" stroke-width="1"/>
    <text x="130" y="62" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#e32b3c" text-anchor="middle">ASSET STRATEGY</text>

    <!-- Corner Decorative Accents -->
    <path d="M 24,44 L 24,24 L 44,24" fill="none" stroke="#e32b3c" stroke-width="2"/>
    <path d="M 936,44 L 936,24 L 916,24" fill="none" stroke="#e32b3c" stroke-width="2"/>
    <path d="M 24,556 L 24,576 L 44,576" fill="none" stroke="#e32b3c" stroke-width="2"/>
    <path d="M 936,556 L 936,576 L 916,576" fill="none" stroke="#e32b3c" stroke-width="2"/>

    <!-- Technical Grid & Architectural Lines -->
    <line x1="80" y1="120" x2="880" y2="120" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="80" y1="240" x2="880" y2="240" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="80" y1="360" x2="880" y2="360" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="80" y1="480" x2="880" y2="480" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Main Artwork -->
    
  <!-- Regional Site & Commercial Zone Plan -->
  <rect x="280" y="140" width="400" height="240" rx="4" fill="#120f10" stroke="#e32b3c" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="320" y="170" width="140" height="90" fill="#1c1618" stroke="#87212b" stroke-width="1.5"/>
  <text x="390" y="220" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#e32b3c" text-anchor="middle">COMMERCIAL NODE</text>
  <rect x="500" y="170" width="140" height="180" fill="#181315" stroke="#443" stroke-width="1.5"/>
  <text x="570" y="265" font-family="'Manrope', sans-serif" font-size="11" font-weight="700" fill="#888" text-anchor="middle">REST AREA ZONE</text>
  <line x1="240" y1="260" x2="720" y2="260" stroke="#e32b3c" stroke-width="2"/>
  <circle cx="280" cy="260" r="6" fill="#f2efeb"/>
  <circle cx="680" cy="260" r="6" fill="#e32b3c"/>
  <text x="480" y="125" font-family="'Manrope', sans-serif" font-size="10" letter-spacing="3" fill="#666" text-anchor="middle">CORRIDOR INFRASTRUCTURE &amp; ZONING</text>


    <!-- Labels & Accents -->
    <text x="50" y="525" font-family="'Anton', Impact, sans-serif" font-size="34" letter-spacing="1" fill="#f2efeb">PT PATRA SARANA INDONESIA</text>
    <text x="50" y="550" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#a09c9a">Commercial Asset Feasibility & Regional Planning Initiative</text>
    <text x="910" y="550" font-family="'Manrope', sans-serif" font-size="10" letter-spacing="2" fill="#e32b3c" text-anchor="end">FEASIBILITY STUDY · STRATEGIC INITIATIVE</text>
