<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
    <defs>
      <radialGradient id="cardGrad" cx="50%" cy="40%" r="65%">
        <stop offset="0%" stop-color="#191617"/>
        <stop offset="60%" stop-color="#0f0d0e"/>
        <stop offset="100%" stop-color="#080708"/>
      </radialGradient>
      <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#e32b3c"/>
        <stop offset="100%" stop-color="#800615"/>
      </linearGradient>
    </defs>

    <!-- Dark Background -->
    <rect width="960" height="600" fill="url(#cardGrad)"/>

    <!-- Subtle Outer Border -->
    <rect x="24" y="24" width="912" height="552" fill="none" stroke="#252122" stroke-width="1"/>

    <!-- Header Badge -->
    <rect x="50" y="46" width="160" height="24" rx="3" fill="#191617" stroke="#e32b3c" stroke-width="1"/>
    <text x="130" y="62" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#e32b3c" text-anchor="middle">PUBLISHED BOOK</text>

    <!-- Corner Decorative Accents -->
    <path d="M 24,44 L 24,24 L 44,24" fill="none" stroke="#e32b3c" stroke-width="2"/>
    <path d="M 936,44 L 936,24 L 916,24" fill="none" stroke="#e32b3c" stroke-width="2"/>
    <path d="M 24,556 L 24,576 L 44,576" fill="none" stroke="#e32b3c" stroke-width="2"/>
    <path d="M 936,556 L 936,576 L 916,576" fill="none" stroke="#e32b3c" stroke-width="2"/>

    <!-- Technical Grid & Architectural Lines -->
    <line x1="80" y1="120" x2="880" y2="120" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="80" y1="240" x2="880" y2="240" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="80" y1="360" x2="880" y2="360" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="80" y1="480" x2="880" y2="480" stroke="#242021" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Main Artwork -->
    
  <!-- 3D Isometric Book Silhouette -->
  <g transform="translate(480, 240)">
    <!-- Book Shadow -->
    <ellipse cx="10" cy="140" rx="130" ry="25" fill="#000" opacity="0.6"/>
    <!-- Book Spine & Cover -->
    <polygon points="-80,110 60,135 120,-30 -20,-55" fill="#1b1214" stroke="#87212b" stroke-width="1.5"/>
    <polygon points="-80,110 -20,-55 -30,-60 -90,105" fill="#120c0d" stroke="#e32b3c" stroke-width="1.5"/>
    <!-- Book Front Face -->
    <polygon points="-20,-55 120,-30 110,125 -30,100" fill="#1e1416" stroke="#e32b3c" stroke-width="2"/>
    <!-- Front Cover Typo -->
    <text x="40" y="0" font-family="'Anton', sans-serif" font-size="18" fill="#f2efeb" text-anchor="middle">REAL ESTATE</text>
    <text x="40" y="24" font-family="'Anton', sans-serif" font-size="22" fill="#e32b3c" text-anchor="middle">REWIRED</text>
    <text x="40" y="48" font-family="'Caveat', cursive" font-size="14" fill="#a09c9a" text-anchor="middle">Ervan Erianto</text>
    <line x1="0" y1="65" x2="80" y2="65" stroke="#e32b3c" stroke-width="1.5"/>
  </g>


    <!-- Labels & Accents -->
    <text x="50" y="525" font-family="'Anton', Impact, sans-serif" font-size="34" letter-spacing="1" fill="#f2efeb">REAL ESTATE REWIRED</text>
    <text x="50" y="550" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#a09c9a">Logika Keputusan Praktisi Developer Properti — Terbit Mandiri</text>
    <text x="910" y="550" font-family="'Manrope', sans-serif" font-size="10" letter-spacing="2" fill="#e32b3c" text-anchor="end">OFFICIALLY PUBLISHED · 2024</text>
</svg>