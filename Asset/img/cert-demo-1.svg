<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
    <defs>
      <radialGradient id="certBg" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#181516"/>
        <stop offset="60%" stop-color="#0f0e0f"/>
        <stop offset="100%" stop-color="#080708"/>
      </radialGradient>
      <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="50%" stop-color="#f0b429"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
      <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7DD3FC"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="850" fill="url(#certBg)"/>
    
    <!-- Outer Ornamental Border -->
    <rect x="36" y="36" width="1128" height="778" fill="none" stroke="url(#goldBorder)" stroke-width="2" opacity="0.85"/>
    <rect x="46" y="46" width="1108" height="758" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
    <rect x="56" y="56" width="1088" height="738" fill="none" stroke="#333" stroke-width="1"/>
    
    <!-- Corner Ornaments -->
    <g fill="#38BDF8">
      <polygon points="36,36 76,36 36,76"/>
      <polygon points="1164,36 1124,36 1164,76"/>
      <polygon points="36,814 76,814 36,774"/>
      <polygon points="1164,814 1124,814 1164,774"/>
    </g>
    
    <!-- Demo Watermark Banner -->
    <text x="600" y="115" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#38BDF8" text-anchor="middle">OFFICIAL ARCHIVE DEMONSTRATION · SAMPLE RECORD</text>
    <line x1="400" y1="130" x2="800" y2="130" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    
    <!-- Main Header -->
    <text x="600" y="210" font-family="'Anton', sans-serif" font-size="44" letter-spacing="3" fill="#f2efeb" text-anchor="middle">HONORARY VFX RECOGNITION</text>
    <text x="600" y="250" font-family="'Manrope', sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#a09c9a" text-anchor="middle">INTERNATIONAL CINEMATIC AWARDS · 2025</text>
    
    <!-- Presented to -->
    <text x="600" y="340" font-family="'Caveat', cursive" font-size="28" fill="#38BDF8" text-anchor="middle">Presented with distinction to</text>
    <text x="600" y="415" font-family="'Anton', sans-serif" font-size="58" letter-spacing="4" fill="url(#redAccent)" text-anchor="middle">ALEX VANCE</text>
    <line x1="300" y1="445" x2="900" y2="445" stroke="#443b3b" stroke-width="1"/>
    
    <!-- Citation -->
    <text x="600" y="510" font-family="'Manrope', sans-serif" font-size="18" fill="#d2ceca" text-anchor="middle" max-width="800">
      <tspan x="600" dy="0">In recognition of outstanding artistic vision, lighting fidelity,</tspan>
      <tspan x="600" dy="28"> and seamless photorealistic compositing in independent cinema.</tspan>
    </text>
    
    <!-- Seal &amp; Signatures -->
    <g transform="translate(600, 670)">
      <!-- Golden Seal -->
      <circle r="46" fill="#141314" stroke="url(#goldBorder)" stroke-width="3"/>
      <circle r="38" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,3"/>
      <text y="5" font-family="'Anton', sans-serif" font-size="16" letter-spacing="1" fill="#f2efeb" text-anchor="middle">VERIFIED</text>
      <text y="22" font-family="'Manrope', sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#38BDF8" text-anchor="middle">DEMO</text>
    </g>
    
    <!-- Left Signature -->
    <g transform="translate(260, 680)">
      <line x1="-120" y1="0" x2="120" y2="0" stroke="#555" stroke-width="1"/>
      <text y="-14" font-family="'Caveat', cursive" font-size="24" fill="#a09c9a" text-anchor="middle">Marcus Vance</text>
      <text y="20" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#888" text-anchor="middle">JURY PRESIDENT</text>
    </g>
    
    <!-- Right Signature -->
    <g transform="translate(940, 680)">
      <line x1="-120" y1="0" x2="120" y2="0" stroke="#555" stroke-width="1"/>
      <text y="-14" font-family="'Caveat', cursive" font-size="24" fill="#a09c9a" text-anchor="middle">Elena Rostova</text>
      <text y="20" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#888" text-anchor="middle">CREATIVE DIRECTOR</text>
    </g>
    
    <!-- Bottom Reference ID -->
    <text x="600" y="775" font-family="'Manrope', sans-serif" font-size="10" letter-spacing="3" fill="#666" text-anchor="middle">REGISTRATION #CIN-2025-VFX-DEMO · ALL RIGHTS RESERVED</text>
  </svg>